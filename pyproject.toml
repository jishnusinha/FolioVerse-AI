[tool.uv.workspace]
members = ["apps/ai-service", "packages/folioverse-ml"]

[tool.ruff]
extend = "packages/shared-config/ruff.toml"
# Generated by jupytext from the paired .py sources, which are linted instead.
extend-exclude = ["ml-notebooks/*.ipynb"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells import where they are used, after the first cell puts fvnb on sys.path.
"ml-notebooks/**" = ["E402"]
