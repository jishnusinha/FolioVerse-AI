# Model registry seed. Entries are created with status UNVERIFIED; an admin verifies them in
# /app/admin/models. Model identifiers for real providers are never hard-coded: they come from
# environment variables, and entries whose variable is unset are skipped.
# Prices are entered by an admin with a source URL and effective date. The only seeded price is
# the deterministic mock model's DEMO price, clearly flagged as not a real provider price.
models:
  - id: mock-grounded
    provider: mock
    model: folioverse-mock-1
    displayName: FolioVerse Mock (deterministic)
    contextWindow: 32000
    maxOutputTokens: 800
    capabilities: [chat, json]
    isDemo: true
    defaultWhen: no-live-provider
    demoPrice:
      inputPerMTok: "0.50"
      outputPerMTok: "1.50"
      cachedInputPerMTok: "0.25"
      sourceUrl: "demo://not-a-real-provider-price"

  # Second deterministic mock (answers with the main clause of its first cited sentence) so Model Battle,
  # fallbacks and Cost-vs-Quality have two contestants without a paid provider. DEMO price, not real.
  - id: mock-concise
    provider: mock
    model: folioverse-mock-concise
    displayName: FolioVerse Mock Concise (deterministic)
    contextWindow: 32000
    maxOutputTokens: 300
    capabilities: [chat, json]
    isDemo: true
    demoPrice:
      inputPerMTok: "0.20"
      outputPerMTok: "0.60"
      cachedInputPerMTok: "0.10"
      sourceUrl: "demo://not-a-real-provider-price"

  - id: openai-primary
    provider: openai
    model: env:FV_OPENAI_MODEL
    displayName: OpenAI (configured model)
    contextWindow: 128000
    maxOutputTokens: 1200
    capabilities: [chat, json, stream]
    isDemo: false
    defaultWhen: live-provider
    fallbacks: [openai-fallback]

  - id: openai-fallback
    provider: openai
    model: env:FV_OPENAI_FALLBACK_MODEL
    displayName: OpenAI (fallback model)
    contextWindow: 128000
    maxOutputTokens: 1200
    capabilities: [chat, json, stream]
    isDemo: false

  - id: ollama-local
    provider: ollama
    model: env:FV_OLLAMA_MODEL
    displayName: Local model via Ollama
    contextWindow: 8192
    maxOutputTokens: 800
    capabilities: [chat]
    isDemo: false

  # Embedding and rerank CPU time (ingestion and queries). Not selectable for chat. Its price is a
  # CPU_HOUR rate (stored in inputPerMTok) that an admin may enter; until then local compute is
  # FINAL_ESTIMATED at 0.
  - id: local-compute
    provider: local
    model: cpu-embedding
    displayName: Local compute (ingestion and embeddings)
    contextWindow: 0
    maxOutputTokens: 0
    capabilities: [compute]
    isDemo: false
