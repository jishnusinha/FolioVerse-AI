<style>
/* ===== 1. DESIGN TOKENS — mirror packages/design-tokens ===== */
:root{

--fv-text:#1D1E23;--fv-muted:#555A68;--fv-subtle:#6C7180;--fv-border:#E1DFD9;--fv-border-strong:#C8C5BD;
--fv-accent:#5A4BD1;--fv-accent-fg:#FFFFFF;--fv-accent-soft:#ECE9FB;--fv-hover:rgba(29,30,35,.05);--fv-selected:#E7E3FA;

--fv-paper:#FFFDF8;--fv-ink:#24221F;--fv-sepia:#F4EBD8;--fv-sepia-ink:#3A3125;--fv-night:#15161B;--fv-night-ink:#D8D3C9;
--fv-chart-1:#5A4BD1;--fv-chart-2:#2B8585;--fv-chart-3:#B8862F;
--fv-cover-1:#2E3A59;--fv-cover-2:#3E5A4B;--fv-cover-3:#7A4A35;--fv-cover-4:#5A3D63;--fv-cover-5:#3B4954;--fv-cover-6:#87682A;
--fv-shadow-1:0 1px 2px rgba(22,22,32,.06);--fv-shadow-2:0 6px 20px rgba(22,22,32,.08),0 1px 3px rgba(22,22,32,.06);--fv-shadow-3:0 18px 50px rgba(22,22,32,.18);
}
[data-theme=dark],.studio{
--fv-bg:#111216;--fv-surface:#17181D;--fv-raised:#1F2127;--fv-sunken:#0D0E11;--fv-sidebar:#0F1013;
--fv-text:#E6E6EA;--fv-muted:#A4A8B4;--fv-subtle:#8B8F9B;--fv-border:#272930;--fv-border-strong:#3A3D46;
--fv-accent:#9488FF;--fv-accent-fg:#14131F;--fv-accent-soft:#25223D;--fv-hover:rgba(255,255,255,.05);--fv-selected:#2A2647;
--fv-ok:#5CC49A;--fv-ok-soft:#173027;--fv-warn:#E3AE55;--fv-warn-soft:#33281A;--fv-bad:#F08470;--fv-bad-soft:#3A1F1B;--fv-info:#77B2E3;--fv-info-soft:#182A3A;--fv-neutral:#A4A8B4;--fv-neutral-soft:#24262C;

--fv-shadow-1:0 1px 2px rgba(0,0,0,.4);--fv-shadow-2:0 6px 20px rgba(0,0,0,.35);--fv-shadow-3:0 18px 50px rgba(0,0,0,.55);
}
.studio{--fv-bg:#121318;--fv-surface:#191B21;--fv-border:#2B2E37;background:var(--fv-bg);color:var(--fv-text)}
/* ===== 2. BASE ===== */
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:var(--fv-fs-md)/1.5 var(--fv-font-sans);color:var(--fv-text);background:var(--fv-bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--fv-accent)}
:focus-visible{outline:2px solid var(--fv-accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.25}h1{font-size:var(--fv-fs-2xl)}h2{font-size:var(--fv-fs-lg)}h3{font-size:var(--fv-fs-md)}p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-48px;z-index:99;background:var(--fv-accent);color:var(--fv-accent-fg);padding:8px 12px;border-radius:6px}.skip:focus{top:8px}
.mono{font-family:var(--fv-font-mono);font-size:var(--fv-fs-xs)}.muted{color:var(--fv-muted)}.subtle{color:var(--fv-subtle)}
.eyebrow{font-size:var(--fv-fs-2xs);letter-spacing:.08em;text-transform:uppercase;color:var(--fv-subtle);font-weight:650}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}.stack{display:flex;flex-direction:column;gap:24px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}
/* ===== 3. SHELL ===== */
.app{display:grid;grid-template-columns:var(--fv-rail) 1fr;height:100vh;transition:grid-template-columns var(--fv-dur-slow) var(--fv-ease)}
.app.expanded{grid-template-columns:var(--fv-rail-expanded) 1fr}.app.bare{grid-template-columns:1fr}.app.bare .rail,.app.bare .topbar{display:none}.app.bare .frame{grid-template-rows:1fr}
.rail{background:var(--fv-sidebar);border-right:1px solid var(--fv-border);display:flex;flex-direction:column;gap:2px;padding:10px 8px;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:650;white-space:nowrap}.brand svg{flex-shrink:0}.ai-mark{color:var(--fv-ai);font-size:11px;letter-spacing:.08em}
.nav-btn{display:flex;align-items:center;gap:12px;height:38px;padding:0 10px;border:0;background:none;border-radius:var(--fv-r-sm);color:var(--fv-muted);cursor:pointer;white-space:nowrap;text-decoration:none;width:100%;flex-shrink:0}
.nav-btn svg{flex-shrink:0}.nav-btn:hover{background:var(--fv-hover);color:var(--fv-text)}.nav-btn[aria-current=page]{background:var(--fv-surface);color:var(--fv-text);box-shadow:var(--fv-shadow-1)}.nav-btn[aria-current=page] svg{color:var(--fv-accent)}
.nav-label{transition:opacity var(--fv-dur)}.app:not(.expanded) .nav-label{opacity:0;pointer-events:none}
.rail-sep{height:1px;background:var(--fv-border);margin:8px 6px}.rail-bottom{margin-top:auto;display:flex;flex-direction:column;gap:2px}[data-m=only]{display:none}
.avatar{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--fv-accent-soft);color:var(--fv-accent);font-size:10px;font-weight:700;flex-shrink:0;margin-left:-2px}
.frame{display:grid;grid-template-rows:var(--fv-topbar) 1fr;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--fv-border);background:var(--fv-bg)}
.crumbs{display:flex;gap:6px;align-items:center;font-size:var(--fv-fs-sm);color:var(--fv-muted);white-space:nowrap;overflow:hidden;min-width:0}.crumbs b{color:var(--fv-text);font-weight:550}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;height:34px;min-width:250px;padding:0 10px;border:1px solid var(--fv-border);border-radius:var(--fv-r-md);background:var(--fv-surface);color:var(--fv-subtle);cursor:pointer}.search kbd{margin-left:auto}
main{overflow:auto;min-height:0;position:relative}main:focus{outline:none}
.dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--fv-accent)}
/* ===== 4. COMPONENTS ===== */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--fv-r-sm);border:1px solid var(--fv-border);background:var(--fv-surface);cursor:pointer;font-size:var(--fv-fs-sm);font-weight:520;white-space:nowrap;text-decoration:none;color:var(--fv-text);transition:background var(--fv-dur-fast),border-color var(--fv-dur-fast)}
.btn:hover{background:var(--fv-hover);border-color:var(--fv-border-strong)}.btn.primary{background:var(--fv-accent);color:var(--fv-accent-fg);border-color:transparent}.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}.btn.ai{background:var(--fv-ai-soft);color:var(--fv-ai);border-color:var(--fv-ai-line)}.btn.danger{color:var(--fv-bad)}.btn.sm{height:26px;padding:0 9px;font-size:var(--fv-fs-xs)}.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{position:relative;width:32px;height:32px;display:inline-grid;place-items:center;border:0;background:none;border-radius:var(--fv-r-sm);color:var(--fv-muted);cursor:pointer;flex-shrink:0;text-decoration:none}.icon-btn:hover{background:var(--fv-hover);color:var(--fv-text)}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:var(--fv-r-pill);font-size:var(--fv-fs-2xs);font-weight:650;white-space:nowrap;background:var(--fv-neutral-soft);color:var(--fv-neutral)}
.badge[data-tone=ok]{background:var(--fv-ok-soft);color:var(--fv-ok)}.badge[data-tone=warn]{background:var(--fv-warn-soft);color:var(--fv-warn)}.badge[data-tone=bad]{background:var(--fv-bad-soft);color:var(--fv-bad)}.badge[data-tone=info]{background:var(--fv-info-soft);color:var(--fv-info)}.badge[data-tone=ai]{background:var(--fv-ai-soft);color:var(--fv-ai)}
.card{background:var(--fv-surface);border:1px solid var(--fv-border);border-radius:var(--fv-r-lg)}.pad{padding:var(--fv-s-5)}
.sect-h{display:flex;align-items:center;gap:10px;font-size:var(--fv-fs-sm);font-weight:650;margin:0 0 12px}.sect-h::after{content:"";flex:1;height:1px;background:var(--fv-border)}
.seg{display:inline-flex;padding:2px;background:var(--fv-sunken);border-radius:var(--fv-r-md);gap:2px}
.seg button{border:0;background:none;height:28px;padding:0 10px;border-radius:8px;cursor:pointer;color:var(--fv-muted);font-size:var(--fv-fs-sm)}.seg button[aria-pressed=true]{background:var(--fv-surface);color:var(--fv-text);box-shadow:var(--fv-shadow-1)}
.chipbtn{height:28px;padding:0 11px;border-radius:var(--fv-r-pill);border:1px solid var(--fv-border);background:var(--fv-surface);cursor:pointer;font-size:var(--fv-fs-xs);color:var(--fv-text)}.chipbtn:hover{border-color:var(--fv-border-strong)}.chipbtn[aria-pressed=true]{background:var(--fv-accent-soft);border-color:var(--fv-accent);color:var(--fv-accent)}
.input,.select{height:34px;padding:0 10px;border:1px solid var(--fv-border);border-radius:var(--fv-r-sm);background:var(--fv-surface);width:100%}textarea.input{height:auto;padding:10px}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:var(--fv-fs-xs);color:var(--fv-muted);font-weight:550}
.table{width:100%;border-collapse:collapse;font-size:var(--fv-fs-sm)}.table th{text-align:left;font-weight:650;color:var(--fv-subtle);font-size:var(--fv-fs-2xs);text-transform:uppercase;letter-spacing:.06em;padding:9px 10px;border-bottom:1px solid var(--fv-border);white-space:nowrap}
.table td{padding:9px 10px;border-bottom:1px solid var(--fv-border);vertical-align:middle}.table tbody tr:hover td{background:var(--fv-hover)}.table tr.sel td{background:var(--fv-selected)}.table tr[data-act]{cursor:pointer}.num{text-align:right;font-variant-numeric:tabular-nums}
.linkish{border:0;background:none;padding:0;cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-align:left;font-weight:520}
.bar{height:6px;border-radius:99px;background:var(--fv-sunken);overflow:hidden;display:flex}.bar>i{display:block;height:100%;background:var(--fv-accent);transition:width var(--fv-dur-slow) var(--fv-ease)}
.ft{display:inline-grid;place-items:center;min-width:34px;height:20px;padding:0 3px;border-radius:4px;font:700 9.5px var(--fv-font-mono);border:1px solid currentColor;color:var(--fv-muted)}.ft[data-t=PDF]{color:var(--fv-bad)}.ft[data-t=DOCX],.ft[data-t=DOCM]{color:var(--fv-info)}.ft[data-t=MD]{color:var(--fv-ok)}
.stages{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:6px;max-width:220px}.stages i{height:4px;border-radius:2px;background:var(--fv-sunken)}.stages i.done{background:var(--fv-ok)}.stages i.now{background:var(--fv-info);animation:pulse 1.4s ease-in-out 3}.stages i.bad{background:var(--fv-bad)}.stages i.warn{background:var(--fv-warn)}
.stage-l{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;font-size:10px;color:var(--fv-subtle);max-width:220px;margin-top:3px}@keyframes pulse{50%{opacity:.4}}
.callout{padding:10px 12px;border-radius:var(--fv-r-md);font-size:var(--fv-fs-sm);background:var(--fv-sunken);border-left:3px solid var(--fv-border-strong)}.callout.warn{background:var(--fv-warn-soft);border-color:var(--fv-warn)}.callout.bad{background:var(--fv-bad-soft);border-color:var(--fv-bad)}.callout.ai{background:var(--fv-ai-soft);border-color:var(--fv-ai-line)}
.empty{padding:28px;text-align:center;color:var(--fv-muted)}
kbd{font:600 10.5px var(--fv-font-mono);padding:1px 5px;border:1px solid var(--fv-border-strong);border-bottom-width:2px;border-radius:4px;color:var(--fv-muted);background:var(--fv-surface)}
.kv{display:grid;grid-template-columns:118px 1fr;gap:7px 12px;font-size:var(--fv-fs-sm);margin:0}.kv dt{color:var(--fv-subtle)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ai-block{border-left:2px solid var(--fv-ai-line);padding:2px 0 2px 14px}.ai-tag{display:inline-flex;align-items:center;gap:6px;font-size:var(--fv-fs-2xs);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fv-ai);margin-bottom:6px}
.cite{display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 5px;margin:0 1px;border-radius:5px;font:700 10.5px var(--fv-font-mono);border:1px solid currentColor;cursor:pointer;vertical-align:1px;background:var(--fv-surface)}
.cite[data-tone=ok]{color:var(--fv-ok)}.cite[data-tone=warn]{color:var(--fv-warn);border-style:dashed}.cite[data-tone=bad]{color:var(--fv-bad);border-style:dotted}.cite[data-tone=neutral]{color:var(--fv-neutral);border-style:dotted;text-decoration:line-through}
.receipt{border:1px solid var(--fv-border);border-radius:var(--fv-r-md);margin-top:10px;background:var(--fv-bg)}
.receipt>button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:0;background:none;cursor:pointer;font-size:var(--fv-fs-xs);text-align:left;flex-wrap:wrap}.receipt>button svg{transition:transform var(--fv-dur)}.receipt>button[aria-expanded=true] svg{transform:rotate(90deg)}
.rc-body{padding:2px 12px 12px}.rc-body .kv{font-size:var(--fv-fs-xs);grid-template-columns:96px 1fr}
.vernote{display:flex;gap:6px;align-items:center;font-size:var(--fv-fs-xs);color:var(--fv-warn);background:var(--fv-warn-soft);border-radius:6px;padding:5px 8px;margin:8px 0}
.lens{position:fixed;z-index:70;width:288px;background:var(--fv-raised);border:1px solid var(--fv-border);border-radius:12px;box-shadow:var(--fv-shadow-3);padding:6px;animation:pop var(--fv-dur) var(--fv-ease)}@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.98)}}
.lens-h{padding:6px 8px 8px;border-bottom:1px solid var(--fv-border);margin-bottom:4px}.lens-h .ai-tag{margin:0}.lens-q{font:italic 12px/1.4 var(--fv-font-serif);color:var(--fv-muted);margin-top:4px;display:block}
.lens-a{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:7px 8px;border-radius:7px;cursor:pointer;text-align:left;font-size:var(--fv-fs-sm)}.lens-a:hover,.lens-a:focus-visible{background:var(--fv-ai-soft);outline:none}.lens-a span{margin-left:auto;font-size:10px;color:var(--fv-subtle)}
.lens form{display:flex;gap:6px;padding:6px 4px 2px;border-top:1px solid var(--fv-border);margin-top:4px}
.scrim{position:fixed;inset:0;background:rgba(10,10,16,.34);z-index:60;animation:fade var(--fv-dur)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(var(--fv-drawer),100vw);background:var(--fv-surface);border-left:1px solid var(--fv-border);box-shadow:var(--fv-shadow-3);z-index:61;display:flex;flex-direction:column;animation:slide var(--fv-dur-slow) var(--fv-ease)}.drawer.wide{width:min(620px,100vw)}
.drawer-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--fv-border)}.drawer-b{padding:16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
@keyframes slide{from{transform:translateX(20px);opacity:0}}@keyframes fade{from{opacity:0}}
.quote{font:15.5px/1.65 var(--fv-font-serif);padding:12px 14px;background:var(--fv-paper);color:var(--fv-ink);border:1px solid var(--fv-border);border-left:3px solid var(--fv-ai-line);border-radius:6px}.quote mark{background:var(--fv-ai-soft);color:inherit;border-bottom:1.5px solid var(--fv-ai)}
#toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:90}

.pal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(560px,92vw);background:var(--fv-raised);border:1px solid var(--fv-border);border-radius:14px;box-shadow:var(--fv-shadow-3);z-index:80;overflow:hidden;animation:pop var(--fv-dur) var(--fv-ease)}
.pal input{border:0;border-bottom:1px solid var(--fv-border);width:100%;height:50px;padding:0 16px;background:none;font-size:var(--fv-fs-lg);outline:none}.pal ul{list-style:none;margin:0;padding:6px;max-height:52vh;overflow:auto}
.pal li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:var(--fv-fs-sm)}.pal li[aria-selected=true]{background:var(--fv-selected)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--fv-border)}.tabs button,.tabs a{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--fv-muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:var(--fv-fs-sm);text-decoration:none}.tabs [aria-selected=true],.tabs [aria-current=page]{color:var(--fv-text);border-bottom-color:var(--fv-accent);font-weight:600}
.list{list-style:none;margin:0;padding:0}.li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--fv-border)}.li:last-child{border-bottom:0}
/* ===== 5. LAYOUTS & SCREENS ===== */
.page{max-width:var(--fv-content-max);margin:0 auto;padding:28px 32px 56px}
.panes{display:grid;height:100%;min-height:0}.pane{overflow:auto;min-width:0;min-height:0}
.ctx{background:var(--fv-sidebar);border-right:1px solid var(--fv-border);overflow:auto;padding:12px 8px}.side{border-left:1px solid var(--fv-border);background:var(--fv-surface);overflow:auto;min-width:0}
.tree,.tree ul{list-style:none;margin:0;padding:0}.tree ul{padding-left:14px}
.tnode{display:flex;align-items:center;gap:7px;width:100%;min-height:30px;padding:0 8px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--fv-muted);text-align:left;font-size:var(--fv-fs-sm);text-decoration:none}.tnode:hover{background:var(--fv-hover);color:var(--fv-text)}.tnode[aria-current=true]{background:var(--fv-surface);color:var(--fv-text);box-shadow:var(--fv-shadow-1)}

ACT.accept=()=>{const w=S.w,s=w.sugg;if(!s)return;w.prev={pid:s.pid,text:w.paras[s.pid]};w.paras[s.pid]=s.vs[s.vi];w.ai.add(s.pid);w.rev++;w.revs.unshift(['r'+w.rev,'POST_AI','Just now · accepted '+s.id]);w.sh.unshift([s.id,'ACCEPTED','¶'+s.pid.slice(1)+' · Version '+'AB'[s.vi]]);w.flash=s.pid;w.sugg=null;render();w.flash=null;toast('Suggestion accepted · revision r'+w.rev+' created (local).','ok',{act:'undoAccept',label:'Undo'})};
ACT.undoAccept=()=>{const w=S.w,p=w.prev;if(!p)return;w.paras[p.pid]=p.text;w.ai.delete(p.pid);w.rev++;w.revs.unshift(['r'+w.rev,'RESTORE','Just now · undo of accepted suggestion']);w.prev=null;if(S.route.view==='writer')render();toast('Change undone; the original paragraph is restored (r'+w.rev+').')};
ACT.reject=()=>{const w=S.w,s=w.sugg;if(!s)return;w.sh.unshift([s.id,'REJECTED','¶'+s.pid.slice(1)+' · kept original']);w.sugg=null;render();toast('Suggestion rejected. Your text is unchanged.')};
ACT.variant=t=>{S.w.sugg.vi=+t.dataset.v;rSide()};ACT.regen=()=>{const s=S.w.sugg;if(s)startSugg(s.pid,s.vi)};
ACT.focus=()=>{S.w.focus=!S.w.focus;render();toast(S.w.focus?'Focus mode on. Press Esc to exit.':'Focus mode off.')};
ACT.fsz=t=>{S.w.fs=Math.min(24,Math.max(15,S.w.fs+ +t.dataset.v));render()};ACT.wfont=t=>{S.w.font=t.dataset.v;render()};
ACT.fixIssue=()=>{const w=S.w;w.paras.w2=w.paras.w2.replace('Eight years','Eleven years');w.issue='fixed';w.rev++;w.revs.unshift(['r'+w.rev,'MANUAL','Just now · continuity fix']);render();toast('Paragraph 2 now says “Eleven years”. Revision r'+w.rev+' created (local).','ok')};
ACT.dismissIssue=()=>{S.w.issue='dismissed';render()};
ACT.contCheck=()=>{S.w.tab='ctx';const open=S.w.issue==='open';toast(open?'Continuity check (simulated): 1 possible contradiction, with cited evidence.':'Continuity check (simulated): no new issues against canon.',open?'warn':'ok');if(['writer','dna'].includes(S.route.view))render();else location.hash='/app/writer/manuscripts/glass-meridian'};
ACT.scene=t=>{if(t.dataset.v!=='3.2')toast('Scene '+t.dataset.v+' would load its own document. This prototype includes scene 3.2.')};
ACT.revdiff=()=>openDrawer('Revision compare · r46 ↔ r47',`<p class="subtle">Blocks are aligned by blockId, then compared word by word.</p><p class="diff">${wdiff(MS[0][1],REWRITES.w1[0])}</p><p class="subtle" style="font-size:12px">${SIM}</p>`,{wide:true});
ACT.dnaNode=t=>{S.dna.sel=t.dataset.id;render()};
ACT.approve=t=>{S.dna.facts.find(x=>x.id===t.dataset.id).s='CANON';render();toast('Approved: now CANON. The origin stays AI-extracted for provenance.','ok')};
ACT.rejectFact=t=>{const f=S.dna.facts.find(x=>x.id===t.dataset.id);f.s='RETIRED';f.ev='Rejected by author';render();toast('Proposal rejected and retired. It will not be used in continuity checks.')};
ACT.shelf=t=>{S.lib.shelf=t.dataset.v;render()};ACT.rpanel=()=>{S.lib.panel=!S.lib.panel;render()};ACT.rset=t=>{S.lib[t.dataset.id]=t.dataset.v;render()};
ACT.bm=()=>{const L=S.lib,k='ch7-rp2';if(L.bm.has(k)){L.bm.delete(k);toast('Bookmark removed (local).')}else{L.bm.add(k);toast('Bookmark saved at Chapter 7 · ¶2 (local).','ok')}render()};
ACT.rch=t=>{if(t.dataset.v!=='7')toast('Chapter '+t.dataset.v+' would open at its saved location. This prototype includes Chapter 7.')};
ACT.rcite=()=>{const p=$('[data-rp="rp2"]');if(p){p.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'});p.style.transition='background .3s';p.style.background='var(--fv-ai-soft)';setTimeout(()=>p.style.background='',1400)}};
ACT.toWriter=()=>toast('Excerpt (up to 1,000 characters) sent to The Glass Meridian research notes, with a citation back to this book (simulated).','ok');
ACT.dtype=t=>{S.disc.type=t.dataset.v;render()};ACT.mood=t=>{tog(S.disc.moods,t.dataset.v);render()};ACT.genre=t=>{tog(S.disc.genres,t.dataset.v);render()};
ACT.dclear=()=>{S.disc.moods.clear();S.disc.genres.clear();S.disc.type='All';render()};
ACT.save=t=>{const id=t.dataset.id,r=REC.find(x=>x.id===id);tog(S.disc.saved,id);render();toast(S.disc.saved.has(id)?`Saved “${r.t}” to your ${r.k==='Film'?'watchlist':'to-read list'} (local).`:'Removed from your list.',S.disc.saved.has(id)?'ok':'info')};
ACT.why=t=>{const r=REC.find(x=>x.id===t.dataset.id),names=['Theme overlap','Genre similarity','Semantic affinity','Preference match','Diversity adjustment'];openDrawer(`Why “${e(r.t)}”?`,`<p class="muted">${e(r.why)}</p><p class="callout ai" style="font-size:12px">${SIM} Illustrative signal values for the prototype. In production they come from the logged recommendation run, and the final score is the weighted sum shown in the Recommendation Lab.</p><div class="stack" style="gap:10px">${r.sig.map((v,i)=>`<div class="sig"><span>${names[i]}</span><div class="bar ${v<0?'neg':''}"><i style="width:${Math.abs(v)*100}%"></i></div><span class="mono">${v>0?'+':v<0?'−':''}${Math.abs(v).toFixed(2)}</span></div>`).join('')}</div><div><p class="eyebrow">Shared themes</p><div class="row" style="margin-top:6px">${r.th.map(x=>`<span class="tag">${e(x)}</span>`).join('')}</div></div><div><p class="eyebrow">Related across media</p><ul class="list">${REC.filter(x=>x.k!==r.k&&x.th.some(z=>r.th.includes(z))).slice(0,3).map(x=>`<li class="li"><span class="badge">${x.k}</span>${e(x.t)}</li>`).join('')||'<li class="li subtle">None in the demo catalog.</li>'}</ul></div><a class="btn" href="#/app/discover/recommendation-lab">Open Recommendation Lab →</a>`)};
ACT.srun=t=>{stopStudio();S.st.fork=false;location.hash='/app/studio/runs/'+t.dataset.id};
ACT.snode=t=>{if(S.st.run!==MAIN_RUN){toast('Node details are recorded for '+MAIN_RUN+' only in this prototype.');return}S.st.sel=t.dataset.id;sUpdate()};
ACT.smode=t=>{S.st.mode=t.dataset.v;render()};
ACT.sdemo=()=>{if(S.st.mode==='replay'){runDemo(false);return}openDrawer('Fork & re-execute?',`<p>In production this creates <b>a new child run</b> of <span class="mono">${MAIN_RUN}</span> from the selected checkpoint, calls the model again and <b>may incur cost</b> (preflight ≤ $0.0120 DEMO).</p><p class="callout warn">LLM output is nondeterministic, so the new answer can differ from the original. Trace replay is the only exact, zero-cost way to review a past run.</p><div class="row"><button class="btn primary" data-act="sforkgo">Simulate fork (no real call)</button><button class="btn" data-act="closeDrawer">Cancel</button></div>`)};
ACT.sforkgo=()=>{closeDrawer(true);runDemo(true)};
ACT.sreset=()=>{stopStudio();Object.assign(S.st,{ns:initNS(true),ev:[],status:'SUCCEEDED',fork:false,sel:'generate'});render()};
ACT.crange=t=>{S.cost.range=+t.dataset.v;render()};ACT.cmodel=t=>{S.cost.model=t.dataset.v;render()};ACT.arange=t=>{S.adm.range=+t.dataset.v;render()};
ACT.toc=t=>{const el=$('#'+t.dataset.v);if(el)el.scrollIntoView({behavior:RM?'auto':'smooth'})};
ACT.role=t=>{S.role=t.checked?'user':'admin';renderChrome();toast(t.checked?'Previewing as Regular user: Super Admin is hidden and its route is blocked.':'Super Admin preview restored.')};
ACT.lens=t=>{const L=S.lens;if(!L)return;closeLens();(LA[t.dataset.v]||(()=>{}))(L.ctx)};
const LA={explain:c=>askSim('Explain: “'+clip(c.text,70)+'”','In plain terms, the passage states the report’s central forecast and the condition behind it. It is a projection from a fictional survey, not a measured outcome [S1].'),
ask:c=>{const ta=$('#askq');if(ta){ta.value='About “'+clip(c.text,80)+'”: ';ta.focus()}},
related:()=>openDrawer('Related evidence '+SIM,`<ul class="list">${['S2','S3'].map(id=>`<li class="li">${chip(id)}<div><b style="font-weight:550">${e(CITES[id].doc)}</b><p class="subtle" style="font-size:12px">${e(CITES[id].loc)}</p></div></li>`).join('')}</ul><p class="subtle" style="font-size:12px">Hybrid retrieval within the conversation scope, excluding the selected passage.</p>`),
note:()=>toast('Added to Project Atlas notes with a citation to v3, p. 12 (local demo).','ok'),
compare:()=>toast('Would start multi_doc_compare against Risk Assessment.pdf v3 · preflight ≤ $0.020 DEMO. Not run in the prototype.'),
facts:()=>askSim('Extract facts from the selection','Base-case CAGR: 14.2% [S1]. Period: 2026–2030 [S1]. Segment: assisted-research tools. All values are illustrative.'),
rewrite:c=>startSugg(c.pid,0),alts:c=>startSugg(c.pid,1),
expand:()=>toast('Expand would run writer_revision with action=EXPAND. Canned output exists only for Rewrite and Alternatives.'),improve:()=>LA.expand(),
tone:()=>toast('Change tone offers presets (warmer, colder, more formal). Canned output exists only for Rewrite and Alternatives.'),
continuity:()=>ACT.contCheck(),askw:()=>toast('Asking about a selection opens a scene-scoped thread that cites manuscript revisions (simulated).'),
define:()=>startExpl('Definition','A ledger is a book of accounts that records debts and payments in order. Here it frames the lanterns as a record of obligations rather than as light.'),
rexplain:()=>startExpl('Explain the metaphor','The passage turns the lanterns into a ledger: each flame is an unpaid promise, lit in order of age. “Owing the sky an answer” suggests obligations to something larger than the community, perhaps the dead or the future. Reading the ring “the way her mother read weather” makes this moral accounting something learned and inherited, read for signs rather than simply seen.'),
summ:()=>startExpl('Summary','The keepers light lanterns in the order of the promises they owe; Ada reads the ring as a moral account rather than as illumination.'),
hl:c=>{S.lib.hl.push([c.rp||'rp2',clip(c.text,160)]);render();toast('Highlight saved (local).','ok')},
rask:()=>toast('Type your question in the Lens field; answers stay scoped to this book.'),
study:c=>{(S.lib.notes=S.lib.notes||[]).push('Study note: '+clip(c.text,80));render();toast('Study note created (local).','ok')}};
FORM.ask=()=>{const ta=$('#askq'),q=ta.value.trim();if(!q){toast('Type a question first.','warn');ta.focus();return}ta.value='';askSim(q,ASK_A)};
FORM.lensask=()=>{const q=$('#lensq').value.trim(),L=S.lens;if(!q){$('#lensq').focus();return}closeLens();if(L.kind==='K')askSim(q,'Based on the selected passage, 14.2% is the base-case projection [S1]; the report treats the 19% case as plausible but not probable [S2].');else if(L.kind==='R')startExpl('Your question','“'+q+'”: answered from Chapter 7 only. The lanterns record promises in order of age; the passage does not say who keeps the written ledger.');else toast('Scene-scoped questions are simulated in this prototype.')};
FORM.dq=()=>toast('Query re-ranked (simulated). Results reflect the active filters.','ai');
CHG.ver=t=>{S.d.ver=+t.value;render()};CHG.model=t=>{S.d.model=t.value;rChat();toast('Model plan: '+(t.value==='auto'?'routed by task profile':t.value)+'. It appears on every Run Receipt.')};
CHG.defm=t=>{S.d.model=t.value;toast('Default model saved (local demo).','ok')};CHG.amodel=t=>{S.adm.model=t.value;render()};CHG.est=t=>{S.est.model=t.value;$('#estout').innerHTML=estHTML()};
INP.kq=t=>{S.k.q=t.value;$('#ktbody').innerHTML=tbody();$('#kcount').textContent=filtered().length+' of '+D.docs.length};
INP.rfs=t=>{S.lib.fs=+t.value;$('#reader').style.setProperty('--r-fs',t.value+'px');$('#rfsv').textContent=t.value+'px'};
INP.est=t=>{const k=t.dataset.id;S.est[k]=Math.max(k==='calls'?1:0,Math.round(+t.value||0));$('#estout').innerHTML=estHTML()};
function onPara(p){const id=p.dataset.pid,w=S.w;w.paras[id]=p.textContent;if(w.sugg&&w.sugg.pid===id&&w.sugg.status==='PENDING'){w.sugg.status='STALE';p.parentElement.classList.remove('pending');rSide()}const a=$('#autosave');if(a)a.textContent='Saving…';clearTimeout(w.t);w.t=setTimeout(()=>{const b=$('#autosave');if(b)b.textContent='Saved · r'+w.rev+' + draft (local)'},800)}
function trySel(){const sel=getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount)return;const txt=sel.toString().trim();if(txt.length<3)return;const n=sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentElement;if(!n)return;let kind=null;const ctx={text:txt};
 if(n.closest('.sheet'))kind='K';else if(n.closest('.manuscript')){kind='W';const p=n.closest('[data-pid]');ctx.pid=p&&p.dataset.pid}else if(n.closest('#rtext')){kind='R';const p=n.closest('[data-rp]');ctx.rp=p&&p.dataset.rp}if(kind)openLens(kind,sel.getRangeAt(0).getBoundingClientRect(),ctx,false)}
/* ===== global listeners ===== */
document.addEventListener('click',ev=>{if(S.lens&&!ev.target.closest('.lens'))closeLens();const t=ev.target.closest('[data-act]');if(!t||!ACT[t.dataset.act])return;ACT[t.dataset.act](t,ev)});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset&&t.dataset.chg&&CHG[t.dataset.chg])CHG[t.dataset.chg](t)});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='palq'){S.palIx=0;palList();return}if(t.dataset&&t.dataset.inp&&INP[t.dataset.inp]){INP[t.dataset.inp](t);return}const p=t.closest&&t.closest('.wp p');if(p)onPara(p)});
document.addEventListener('submit',ev=>{const f=ev.target;if(f.dataset.form&&FORM[f.dataset.form]){ev.preventDefault();FORM[f.dataset.form](f)}});
document.addEventListener('mouseup',ev=>{if(ev.target.closest('.lens,button,a,input,select,textarea'))return;setTimeout(trySel,0)});
document.addEventListener('keyup',ev=>{if(ev.shiftKey&&ev.key.startsWith('Arrow'))trySel()});
document.addEventListener('scroll',ev=>{if(S.lens&&!(ev.target.closest&&ev.target.closest('.lens')))closeLens()},true);
document.addEventListener('keydown',ev=>{const k=ev.key,mod=ev.ctrlKey||ev.metaKey;
 if(mod&&k.toLowerCase()==='k'){ev.preventDefault();$('#pal').innerHTML?closePal():openPalette();return}
 if(mod&&k==='\\'){ev.preventDefault();ACT.rail();return}
 if($('#pal').innerHTML){if(k==='Escape'){closePal();return}if(k==='ArrowDown'||k==='ArrowUp'){ev.preventDefault();const n=S.palItems.length;if(!n)return;S.palIx=(S.palIx+(k==='ArrowDown'?1:n-1))%n;palList();const el=$('#po-'+S.palIx);if(el)el.scrollIntoView({block:'nearest'});return}if(k==='Enter'){ev.preventDefault();runPal(S.palIx);return}if(k==='Tab'){ev.preventDefault();return}}
 if(ev.altKey&&k.toLowerCase()==='l'&&S.lens){ev.preventDefault();const a=$('.lens .lens-a');if(a)a.focus();return}
 if(k==='Escape'){if(S.lens){closeLens(true);return}if(S.drawer){closeDrawer();return}if(S.w.focus&&S.route.view==='writer'){ACT.focus();return}}
 if(k==='Tab'&&S.drawer&&S.drawer.modal){const f=$$('.drawer button,.drawer a[href],.drawer input,.drawer select').filter(x=>!x.disabled);if(f.length){const a=f[0],z=f[f.length-1];if(ev.shiftKey&&document.activeElement===a){ev.preventDefault();z.focus()}else if(!ev.shiftKey&&document.activeElement===z){ev.preventDefault();a.focus()}}}
 if((k==='Enter'||k===' ')&&ev.target.matches&&ev.target.matches('g[role=button]')){ev.preventDefault();ev.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
 if(mod&&k.toLowerCase()==='z'&&S.route.view==='writer'&&S.w.prev&&!(ev.target.closest&&ev.target.closest('.wp p,input,textarea'))){ev.preventDefault();ACT.undoAccept()}});
addEventListener('hashchange',()=>{closeDrawer(true);if($('#pal').innerHTML)$('#pal').innerHTML='';render();$('#main').scrollTop=0;$('#main').focus({preventScroll:true})});
/* ===== init ===== */
if(matchMedia('(prefers-color-scheme: dark)').matches){S.theme='dark';document.documentElement.dataset.theme='dark'}
if(!location.hash)history.replaceState(null,'','#/app');
render();
</script>
