# OpenTelemetry Collector for the `observability` compose profile (and the template for a
# production collector). Services send OTLP here; the collector scrubs and forwards to LGTM.
# Services already avoid content in telemetry; the scrub steps are defence in depth.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins: ["http://localhost:5173", "http://localhost:8080"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
  # Never forward credentials or model payloads, whatever an instrumentation library adds.
  attributes/scrub:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - pattern: ^(gen_ai\.(prompt|completion)|llm\.(prompts|completions)|db\.statement).*
        action: delete
  # Query strings can carry search text; keep only the path.
  transform/strip-query:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["http.url"], "\\?.*$", "")
          - replace_pattern(attributes["http.target"], "\\?.*$", "")
          - replace_pattern(attributes["url.full"], "\\?.*$", "")
          - delete_key(attributes, "url.query")

exporters:
  otlphttp/lgtm:
    endpoint: ${env:FV_OTLP_UPSTREAM}
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, transform/strip-query, batch]
      exporters: [otlphttp/lgtm]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/lgtm]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [otlphttp/lgtm]
