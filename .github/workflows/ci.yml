name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI never consumes paid inference: no provider keys are configured and live tests stay off.
  FV_LIVE_PROVIDER_TESTS: "0"
  OPENAI_API_KEY: ""

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.f.outputs.web }}
      api: ${{ steps.f.outputs.api }}
      ai: ${{ steps.f.outputs.ai }}
      contracts: ${{ steps.f.outputs.contracts }}
      docker: ${{ steps.f.outputs.docker }}
      infra: ${{ steps.f.outputs.infra }}
      docs: ${{ steps.f.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            shared: &shared ['packages/shared-config/**', 'packages/contracts/**', 'pnpm-lock.yaml', '.github/workflows/ci.yml']
            web: [*shared, 'apps/web/**', 'packages/design-tokens/**', 'docs/guide/**', 'docs/notebooks.md', 'docs/planning/IMPLEMENTATION_STATUS.md']
            api: [*shared, 'apps/api/**', 'config/models/**']
            ai: ['apps/ai-service/**', 'packages/folioverse-ml/**', 'packages/contracts/**', 'uv.lock', 'pyproject.toml']
            contracts: ['packages/contracts/**', 'apps/api/src/**']
            docker: ['infrastructure/docker/**', 'docker-compose.yml', 'pnpm-lock.yaml', 'uv.lock', '.github/workflows/ci.yml', 'apps/docs/**']
            docs: ['apps/docs/**', 'docs/**', 'infrastructure/runbooks/**', 'packages/contracts/openapi/**', 'apps/api/prisma/schema.prisma', 'apps/web/src/features/docs/**', 'packages/design-tokens/**', 'pnpm-lock.yaml', '.github/workflows/ci.yml']
            infra: ['infrastructure/**', '.github/workflows/**', 'docker-compose.yml', 'apps/api/src/infra/observability.ts', 'apps/api/src/worker.module.ts']

  node:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (tokens, contracts, api, web)
        run: pnpm -r --if-present run test
      - name: Contracts check
        run: pnpm contracts:check
      - name: Web build
        run: pnpm --filter @folioverse/web run build

  # Documentation site: generators' unit tests, then a full Starlight build (content sync, Pagefind, CSP hashes).
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @folioverse/docs...
      - name: Generator tests
        run: pnpm --filter @folioverse/docs run test
      - name: Build
        run: pnpm docs:build
      - uses: actions/upload-artifact@v4
        with: { name: docs-site, path: apps/docs/dist, retention-days: 7 }

  web-e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @folioverse/web exec playwright install --with-deps chromium
      # Visual baselines are committed for win32 only; the linux baseline is generated in Gate 13.
      - name: Prototype checks and shell e2e
        run: pnpm --filter @folioverse/web run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: web-e2e-results, path: apps/web/test-results, retention-days: 7 }

  api-integration:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: folioverse, POSTGRES_PASSWORD: folioverse, POSTGRES_DB: folioverse_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U folioverse" --health-interval 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @folioverse/api...
      - name: Start S3-compatible storage
        run: docker run -d -p 9000:9000 --name storage chrislusf/seaweedfs:3.80 server -dir=/data -s3 -s3.port=9000
      - name: Integration tests
        run: pnpm --filter @folioverse/api run test:integration

  # Section M fast path on every change: secret scan over full history, dependency audits, and the
  # API/AI security specs. The authz/IDOR/CSRF/rate-limit integration specs run in api-integration.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: pnpm install --frozen-lockfile --filter @folioverse/api...
      - run: uv sync --all-packages --extra dev --frozen
      - name: Security suite (gitleaks, pnpm audit, pip-audit, security specs)
        run: node tests/security/run.mjs --no-integration --audit --strict

  ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --all-packages --extra dev --frozen
      - name: Ruff
        run: uv run --directory apps/ai-service ruff check . && uv run --directory apps/ai-service ruff format --check .
      - name: Pytest (mock provider, hash embedder, in-memory Qdrant)
        run: uv run --directory apps/ai-service pytest -q

  # Images are built and scanned on every push to main and whenever their inputs change; nothing
  # is pushed from CI (release.yml publishes).
  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [web, api, ai]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.image }}.Dockerfile
          tags: folioverse/${{ matrix.image }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Runs as a non-root user
        run: |
          user=$(docker image inspect -f '{{.Config.User}}' folioverse/${{ matrix.image }}:ci)
          echo "image user: ${user:-<unset>}"
          case "$user" in ""|root|0|0:*|root:*) echo "::error::${{ matrix.image }} image runs as root"; exit 1;; esac
      - name: Hardened runtime smoke (read-only, no capabilities)
        if: matrix.image == 'web'
        run: |
          docker run -d --name web --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -e FV_API_UPSTREAM=127.0.0.1:9 -p 8080:8080 folioverse/web:ci
          for _ in $(seq 1 30); do curl -sf http://localhost:8080/healthz && exit 0; sleep 1; done
          docker logs web; exit 1
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: folioverse/${{ matrix.image }}:ci
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.spdx.json
          retention-days: 30
      - name: Vulnerabilities (HIGH and CRITICAL, report)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: folioverse/${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"
      - name: Vulnerabilities (CRITICAL with a fix, gate)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
        with:
          image-ref: folioverse/${{ matrix.image }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - name: Compose files
        run: |
          cp .env.example .env
          docker compose --profile app --profile observability --profile security config --quiet
      - name: Infra scripts (deployed smoke, Grafana dashboards, alert runbook links)
        run: |
          node --test "infrastructure/tests/*.test.mjs"
          node infrastructure/grafana/generate.mjs --check
      - name: OpenTelemetry collector config
        run: docker run --rm -e FV_OTLP_UPSTREAM=http://localhost:4318 -v "$PWD/infrastructure/otel:/cfg:ro" otel/opentelemetry-collector-contrib:0.111.0 validate --config=/cfg/collector.yaml
      - name: Caddyfile
        run: docker run --rm -v "$PWD/infrastructure/docker/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8, terraform_wrapper: false }
      - name: Terraform fmt and validate (no backend, no credentials)
        run: |
          terraform fmt -check -recursive infrastructure/terraform
          for env in lean standard; do
            terraform -chdir=infrastructure/terraform/envs/$env init -backend=false -input=false
            terraform -chdir=infrastructure/terraform/envs/$env validate
          done
      - uses: terraform-linters/setup-tflint@v4
        with: { tflint_version: v0.53.0 }
      - name: tflint
        working-directory: infrastructure/terraform
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"
      - name: Misconfiguration scan (Terraform, Dockerfiles)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: config
          scan-ref: infrastructure
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.3 -color
